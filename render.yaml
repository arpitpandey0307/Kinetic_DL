services:
  - type: web
    name: kinetic-downloader
    env: node
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: YTDLP_PATH
        value: /opt/render/project/src/yt-dlp
      - key: PORT
        value: 10000
