services:
  - type: web
    name: kinetic-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_FILE_SIZE
        value: "1073741824"
      - key: FILE_TTL_MS
        value: "3600000"
      # Optional: logged-in TeraBox "ndus" cookie for full TeraBox downloads
      - key: TERABOX_COOKIE
        sync: false
      # Optional: Netscape cookies.txt content, helps when YouTube blocks datacenter IPs
      - key: YTDLP_COOKIES
        sync: false
